name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        id: setup-bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        id: bun-install
        run: bun install --frozen-lockfile

      - name: Check Format
        id: format-check
        run: bun run format:check

      - name: Lint
        id: lint
        run: bun run lint

      - name: Test
        id: test
        run: bun test

  test-action:
    name: GitHub Actions Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - name: Test Local Action
        id: test-action
        uses: ./
        with:
          changedQueries: queries/query_871114.sql
          duneApiKey: ${{ secrets.DUNE_API_KEY }}

      - name: Print Output
        id: output
        run: echo "${{ steps.test-action.outputs.output }}"
