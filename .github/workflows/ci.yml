name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup Bun
        id: setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install Dependencies
        id: bun-install
        run: bun install --frozen-lockfile

      - name: Check Format
        id: format-check
        run: bun run format:check

      - name: Lint
        id: lint
        run: bun run lint

      - name: Test
        id: test
        run: bun run ci-test

  test-action:
    name: GitHub Actions Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Test Local Action
        id: test-action
        uses: ./
        with:
          dune-api-key: ${{ secrets.DUNE_API_KEY }} # zizmor: ignore[secrets-outside-env]
          changed-files: queries/query_871114.sql

      - name: Print Output
        id: output
        env:
          UPDATED: ${{ steps.test-action.outputs.updated-count }}
          SKIPPED: ${{ steps.test-action.outputs.skipped-count }}
          QUERY_IDS: ${{ steps.test-action.outputs.updated-query-ids }}
        run: echo "Updated=$UPDATED Skipped=$SKIPPED IDs=$QUERY_IDS"
