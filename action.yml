name: "Dune Query Updater"
description: "Updates Dune Analytics queries from SQL files in your repository"
author: "Ben Smith (@bh2smith)"
branding:
  icon: "arrow-up-circle"
  color: "orange"

inputs:
  dune-api-key:
    description: "Dune API key (PLUS tier required)"
    required: true
  duneApiKey:
    description: "Deprecated: use dune-api-key instead"
    required: false
  query-path:
    description: "Directory containing query files"
    default: "queries"
  api-base-url:
    description:
      "Dune API base URL (override to target another environment, e.g. dev)"
    default: "https://api.dune.com/api"
  changed-files:
    description:
      "Comma-separated list of changed query files (auto-detected if omitted)"
    required: false
  changedQueries:
    description: "Deprecated: use changed-files instead"
    required: false
  dry-run:
    description: "Preview changes without executing updates"
    default: "false"
  fail-on-error:
    description: "Fail the action if any query update fails"
    default: "true"

outputs:
  updated-count:
    description: "Number of queries successfully updated"
  skipped-count:
    description: "Number of queries skipped"
  updated-query-ids:
    description: "Comma-separated list of updated query IDs"

runs:
  using: node24
  main: dist/index.js
